name: Refresh Google Solar Insights
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Use all for first setup, then auto"
        required: true
        default: "all"
        type: choice
        options: [all, auto, "0", "1", "2", "3"]
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Building Insights
        env:
          GOOGLE_SOLAR_API_KEY: ${{ secrets.GOOGLE_SOLAR_API_KEY }}
          SOLAR_SHARD: ${{ github.event_name == 'workflow_dispatch' && inputs.shard || 'auto' }}
        run: node scripts/refresh-google-solar.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "Power Up Solar Refresh"
          git config user.email "actions@users.noreply.github.com"
          git add solar-insights.json
          git diff --cached --quiet || git commit -m "Refresh Google Solar insights"
          git push
